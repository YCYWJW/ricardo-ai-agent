spring:
  application:
    name: ricardo-ai-agent
  profiles:
    active: local
  # 文件上传大小限制（简历 PDF 上传解析用）。
  # 说明：Spring 默认单文件上限只有 1MB，不设的话 5MB 的简历会在进接口前就被拒。
  # max-file-size 限制单个文件，max-request-size 限制整条请求（含 multipart 边界开销，留 1MB 余量）。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
# 临时注释掉，便于大家开发调试和部署（实际填写 PgVector 数据库信息）
#  datasource:
#    url: xxx
#    username: root
#    password: 123456
  ai:
    dashscope:
      # 从 .env 的 DASHSCOPE_API_KEY 注入（由 DotenvConfig 加载），此处用占位符引用，不写真值
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
# 临时注释掉，便于大家开发调试和部署（实际需要启动 MCP 服务）
#    mcp:
#      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
# 临时注释掉，便于大家开发调试和部署（实际需要启动 PgVector 数据库）
#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        dimensions: 1536
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ricardo.yuaiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  # 需要替换为你自己的 key
  api-key: 你的 API Key
# 保持 INFO 级别即可，切勿改回 DEBUG——DEBUG 会把对话内容（含简历文本）完整打印到日志
logging:
  level:
    org.springframework.ai: INFO