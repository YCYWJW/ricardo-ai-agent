name: CI（后端测试 + 前端构建）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # 假占位符：只用来满足 ${DASHSCOPE_API_KEY} 占位符解析，让测试能启动，绝不携带任何真实密钥。
    # 真实 key 保存在本机 .env（已被 .gitignore 忽略），永不进入仓库。
    env:
      DASHSCOPE_API_KEY: ci-placeholder

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x mvnw

      - name: 后端测试（全绿，不调真实 API）
        run: ./mvnw -B test

      - name: 前端构建
        working-directory: frontend
        run: |
          npm install
          npm run build